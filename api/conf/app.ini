; =====================================================================
; 顾客小程序端 PHP+YAF API 配置文件
; 复制此文件为 app.ini 并按实际环境修改各项配置
; =====================================================================

[product]

; ----- 应用基础 -----
application.directory = APP_PATH "/application"
application.library   = APP_PATH "/application/library"
application.dispatcher.catchException = 1
application.dispatcher.defaultModule    = "index"
application.dispatcher.defaultController = "Home"
application.dispatcher.defaultAction   = "index"

; ----- 数据库 -----
db.dsn      = "mysql:host=127.0.0.1;port=3306;dbname=shop_db;charset=utf8mb4"
db.username = "root"
db.password = "your_password"

; ----- JWT -----
jwt.secret  = "your_jwt_secret_key_change_in_production"
jwt.ttl     = 7200

; ----- 短信（以阿里云为例，可替换为其他服务商） -----
sms.access_key_id     = "your_aliyun_access_key_id"
sms.access_key_secret = "your_aliyun_access_key_secret"
sms.sign_name         = "城南茶饮"
sms.template_code     = "SMS_000000001"

; ----- 微信小程序 -----
wechat.appid  = "your_miniapp_appid"
wechat.secret = "your_miniapp_secret"

; ----- 微信支付 -----
wxpay.mchid       = "your_mch_id"
wxpay.api_key     = "your_api_key_v3"
wxpay.cert_path   = APP_PATH "/conf/apiclient_cert.pem"
wxpay.key_path    = APP_PATH "/conf/apiclient_key.pem"
wxpay.notify_url  = "https://your-domain.com/api/pay/notify"

[development : product]
db.dsn      = "mysql:host=127.0.0.1;port=3306;dbname=shop_db_dev;charset=utf8mb4"
db.username = "root"
db.password = "root"
